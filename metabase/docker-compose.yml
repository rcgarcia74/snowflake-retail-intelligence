services:
  metabase:
    image: ${METABASE_IMAGE:-metabase/metabase:v0.63.18}
    container_name: retail-demo-metabase
    ports:
      - "3000:3000"
    volumes:
      - ./metabase-data:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      MB_ENCRYPTION_SECRET_KEY: ${MB_ENCRYPTION_SECRET_KEY:?Set MB_ENCRYPTION_SECRET_KEY in the ignored .env file}
      MB_SESSION_SECRET_KEY: ${MB_SESSION_SECRET_KEY:?Set MB_SESSION_SECRET_KEY in the ignored .env file}
    healthcheck:
      test: ["CMD", "curl", "--fail", "-I", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
