# Import names and non-sensitive values only. AWS authentication uses short-lived
# credentials obtained through the Snowflake WIF secret; never add access keys.
AWS_REGION: us-east-2
S3_BUCKET: replace-with-your-bucket
S3_PREFIX: retail-demo/landing/openflow/
AWS_ROLE_ARN: arn:aws:iam::123456789012:role/replace-with-openflow-read-role
AWS_ROLE_SESSION_NAME: retail-demo-openflow
AWS_WIF_AUDIENCE: snowflake
SNOWFLAKE_DATABASE: RETAIL_DEMO
SNOWFLAKE_SCHEMA: RAW
SNOWFLAKE_WAREHOUSE: RETAIL_DEMO_WH
SNOWFLAKE_AUTHENTICATION_STRATEGY: SNOWFLAKE_MANAGED
SNOWFLAKE_WIF_SECRET: RETAIL_DEMO_OPENFLOW_CONTROL.RUNTIME.RETAIL_DEMO_AWS_WIF
